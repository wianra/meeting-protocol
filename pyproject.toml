[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-protocol"
version = "0.1.0"
description = "Offline multilingual meeting transcription for Apple Silicon"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "huggingface-hub>=0.34,<2",
  "mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin'",
  "faster-whisper>=1.2,<2; sys_platform == 'win32'",
  "pyannote-audio>=4.0,<4.1",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
meeting-protocol = "meeting_protocol.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

