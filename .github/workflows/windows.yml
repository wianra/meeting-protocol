# Builds the Windows app on a Windows machine and attaches the zip to a test pre-release.
# There is no Windows build on the Mac; this is the only place it can be produced.
name: Windows build

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 python packaging/windows/build.py
      - name: Attach to the Windows test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload windows-test dist/MeetingProtocol-*-windows-x64.zip --clobber
